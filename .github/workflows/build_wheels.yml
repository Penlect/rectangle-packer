# Taken from: https://github.com/pypa/cibuildwheel/blob/main/examples/github-deploy.yml

name: Build and upload to PyPI

on:
  push:
  pull_request:
  release:
    types:
      - published

permissions:
  contents: read

env:
  CIBW_BUILD_VERBOSITY: 3
  CIBW_TEST_COMMAND: "python -m unittest discover -v {project}/test"
  CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp315-*"
  # Free-threaded builds require a separate compatibility review.
  CIBW_SKIP: "cp3??t-*"
  # Preserve both Windows architectures explicitly across tooling upgrades.
  CIBW_ARCHS_WINDOWS: "AMD64 x86"

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel is an Intel runner, macos-14 is Apple Silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-14]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build wheels
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build SDist
      run: pipx run build --sdist

    - name: Verify tracked files unchanged
      run: |
        git update-index -q --refresh
        git diff --exit-code
        git diff --cached --exit-code

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cibw-sdist
        path: dist/*.tar.gz
        if-no-files-found: error

  upload_all:
    needs: [build_wheels, make_sdist]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"

    - name: Verify tag matches rpack.__version__
      run: |
        python - <<'PY'
        import os
        import re
        from pathlib import Path

        text = Path("rpack/__init__.py").read_text(encoding="utf-8")
        match = re.search(r'^__version__ = "([^"]+)"$', text, flags=re.MULTILINE)
        if not match:
            raise SystemExit("Could not find __version__ in rpack/__init__.py")
        package_version = match.group(1)
        tag = os.environ["GITHUB_REF_NAME"]
        if tag.startswith("v"):
            tag = tag[1:]
        if package_version != tag:
            raise SystemExit(
                f"Version mismatch: tag={os.environ['GITHUB_REF_NAME']} "
                f"but rpack.__version__={package_version}"
            )
        print(f"Version check OK: {package_version}")
        PY

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        skip-existing: true
